<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#eeeeec;font-family:-apple-system,sans-serif}
.stage{width:1140px;height:560px;position:relative;display:flex;align-items:center;justify-content:center;background:#eeeeec;overflow:hidden}
.bg{position:absolute;left:-20px;top:-40px;width:560px;height:850px;background:url(home-before.png) top/100% auto no-repeat;opacity:.28;filter:grayscale(.85);transform:rotate(-6deg)}
.bg:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(238,238,236,0) 40%,rgba(238,238,236,1) 100%)}
.tag{position:absolute;left:28px;top:24px;font:600 12px/1 sans-serif;letter-spacing:.12em;color:#999}
.tag2{position:absolute;right:28px;bottom:24px;font:600 12px/1 sans-serif;letter-spacing:.12em;color:#04374a}
.laptop{position:relative;width:680px}
.lid{background:#1d1d1f;border-radius:18px 18px 0 0;padding:16px 16px 20px}
.screen{height:400px;overflow:hidden;background:#fff;border-radius:2px}
.screen img{width:100%;display:block}
.base{height:16px;margin:0 -50px;background:linear-gradient(#d6d6d8,#a8a8ab);border-radius:0 0 14px 14px;position:relative}
.base:before{content:'';position:absolute;left:50%;top:0;width:110px;height:7px;margin-left:-55px;background:#9a9a9d;border-radius:0 0 8px 8px}
.phone{position:absolute;left:calc(50% + 250px);bottom:56px;width:168px;background:#1d1d1f;border-radius:28px;padding:9px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.phone .scr{height:330px;overflow:hidden;border-radius:20px;background:#fff;position:relative}
.phone .scr img{width:100%;display:block}
.phone .notch{position:absolute;top:6px;left:50%;width:56px;height:16px;margin-left:-28px;background:#1d1d1f;border-radius:10px;z-index:2}
.laptop{transform:translateX(-60px);filter:drop-shadow(0 24px 30px rgba(0,0,0,.18))}
</style></head><body><div class="stage"><div class="bg"></div><span class="tag">BEFORE · 改版前</span><span class="tag2">AFTER · 改版後 RWD</span>
<div class="laptop"><div class="lid"><div class="screen"><img src="home-after-desktop.png"></div></div><div class="base"></div></div>
<div class="phone"><div class="scr"><span class="notch"></span><img src="home-after-mobile.png"></div></div>
</div></body></html>
